name: Publish Brawl Draft
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare game assets
        run: node scripts/download-assets.mjs
        env:
          ASSET_ORIGIN: https://raw.githubusercontent.com/Brawlify/CDN/master/
      - name: Prepare app
        run: |
          node -e "require('fs').copyFileSync('dist/assets/modes/48000006.png','dist/assets/icon.png')"
          node scripts/build.mjs
          node --test tests/engine.test.mjs
          node -e "if(require('./asset-report.json').failed.length)process.exit(1)"
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
